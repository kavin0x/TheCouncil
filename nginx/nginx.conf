worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance ─────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ─── Rate limiting ───────────────────────────────────────────────────
    # Global: 60 requests/minute per IP
    limit_req_zone  $binary_remote_addr  zone=api_global:10m  rate=60r/m;
    # Create-run endpoint: 10 requests/minute per IP (more expensive)
    limit_req_zone  $binary_remote_addr  zone=api_runs:10m    rate=10r/m;
    # WebSocket upgrade zone (generous — long-lived connections)
    limit_req_zone  $binary_remote_addr  zone=ws:10m          rate=30r/m;

    limit_req_status 429;

    # ─── Upstream ────────────────────────────────────────────────────────
    upstream council_api {
        server api:8000;
        keepalive 32;
    }

    # ─── Server block ────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # Cloudflare real-IP restoration
        set_real_ip_from 0.0.0.0/0;
        real_ip_header   X-Forwarded-For;
        real_ip_recursive on;

        # ── Security headers ──────────────────────────────────────────
        add_header X-Content-Type-Options    nosniff          always;
        add_header X-Frame-Options           DENY             always;
        add_header X-XSS-Protection          "1; mode=block"  always;
        add_header Referrer-Policy           strict-origin    always;
        add_header Permissions-Policy        "geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Health (no auth, no rate limit) ───────────────────────────
        location = /health {
            proxy_pass         http://council_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ── WebSocket — real-time deliberation feed ───────────────────
        location ~ ^/ws/ {
            limit_req zone=ws burst=10 nodelay;

            proxy_pass         http://council_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── MCP server ────────────────────────────────────────────────
        location /mcp/ {
            limit_req zone=api_global burst=20 nodelay;

            proxy_pass         http://council_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Run creation (stricter limit) ─────────────────────────────
        location = /runs {
            limit_req zone=api_runs burst=5 nodelay;

            proxy_pass         http://council_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            client_max_body_size 1m;
        }

        # ── All other API endpoints ───────────────────────────────────
        location / {
            limit_req zone=api_global burst=20 nodelay;

            proxy_pass         http://council_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            client_max_body_size 4m;
        }
    }
}
